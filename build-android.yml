# Copy this file to .github/workflows/build-android.yml
name: Build RayKos Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK: '27.0.12077973'
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dfile.encoding=UTF-8

jobs:
  build-android:
    name: Build installable ARM APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out pinned sources and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-cleanup: on-success

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;3.22.1"

      - name: Run source security checks
        run: ./scripts/security_audit.sh

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon --stacktrace -PABI_FILTERS=armeabi-v7a,arm64-v8a testReleaseUnitTest lintRelease

      # A real release key is optional. With no secrets, the workflow creates and
      # caches an install-only debug key, so a first-time user has no setup to do.
      # For production updates define all four repository secrets below.
      - name: Restore automatic install-key cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/raykos-install.keystore
          key: ${{ runner.os }}-raykos-install-key-v1

      - name: Prepare signing key
        id: signing
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          if [[ -n "${SIGNING_KEY_BASE64}" ]]; then
            [[ -n "${SIGNING_STORE_PASSWORD}" ]] || { echo 'Missing ANDROID_SIGNING_STORE_PASSWORD' >&2; exit 1; }
            [[ -n "${SIGNING_KEY_ALIAS}" ]] || { echo 'Missing ANDROID_SIGNING_KEY_ALIAS' >&2; exit 1; }
            [[ -n "${SIGNING_KEY_PASSWORD}" ]] || { echo 'Missing ANDROID_SIGNING_KEY_PASSWORD' >&2; exit 1; }
            KEYSTORE="$RUNNER_TEMP/raykos-release.keystore"
            printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > "$KEYSTORE"
            echo 'kind=repository release key' >> "$GITHUB_OUTPUT"
          else
            KEYSTORE="$HOME/.android/raykos-install.keystore"
            SIGNING_STORE_PASSWORD=android
            SIGNING_KEY_ALIAS=androiddebugkey
            SIGNING_KEY_PASSWORD=android
            if [[ ! -s "$KEYSTORE" ]]; then
              keytool -genkeypair -noprompt \
                -keystore "$KEYSTORE" \
                -storepass "$SIGNING_STORE_PASSWORD" \
                -alias "$SIGNING_KEY_ALIAS" \
                -keypass "$SIGNING_KEY_PASSWORD" \
                -keyalg RSA -keysize 3072 -validity 10000 \
                -dname 'CN=RayKos Install Key,O=RayKos,C=RU'
            fi
            echo 'kind=automatic cached install key' >> "$GITHUB_OUTPUT"
          fi

          {
            echo "APK_KEYSTORE=$KEYSTORE"
            echo "APK_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "APK_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "APK_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs (ARM64 + ARM32)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            -PABI_FILTERS=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$APK_KEYSTORE" \
            -Pandroid.injected.signing.store.password="$APK_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$APK_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$APK_KEY_PASSWORD" \
            assembleRelease

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          mapfile -d '' APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0)
          [[ ${#APKS[@]} -gt 0 ]] || { echo 'Gradle produced no APKs' >&2; exit 1; }

          for apk in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            base="$(basename "$apk")"
            cp "$apk" "release/RayKos-${VERSION}-${base#app-}"
          done

          (cd release && sha256sum ./*.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

          {
            echo '### Android APK build completed'
            echo
            echo '- Architectures: **arm64-v8a + armeabi-v7a**'
            echo '- Minimum Android: **5.0 (API 21)**'
            echo '- Target Android: **14 (API 34)**'
            echo '- Signing: **${{ steps.signing.outputs.kind }}**'
            echo
            echo 'For most phones, download the file containing `universal-release.apk`.'
            echo 'You can also use the smaller `arm64-v8a` APK on modern phones.'
            echo
            echo 'Checksums:'
            echo '```text'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RayKos-Android-ARM-APKs
          path: release/
          if-no-files-found: error
          retention-days: 30
